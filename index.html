<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Blocks!</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="authScreen" class="auth-screen">
    <div class="app">
      <h1 class="title">BLOCKS!</h1>
      <div class="panel auth-panel">
        <div id="authChoice" class="auth-choice">
          <p class="auth-lead">SIGN IN TO SAVE YOUR HIGH SCORE</p>
          <button id="signInChoice" type="button" class="auth-btn">SIGN IN</button>
          <button id="signUpChoice" type="button" class="auth-btn">CREATE ACCOUNT</button>
          <button id="guestChoice" type="button" class="auth-btn auth-btn-ghost">PLAY AS GUEST</button>
        </div>
        <form id="authForm" class="auth-form hidden">
          <div id="authFormTitle" class="auth-form-title">SIGN IN</div>
          <label class="auth-label" for="authUsername">USERNAME</label>
          <input id="authUsername" class="auth-input" type="text" autocomplete="username" maxlength="20" required>
          <label class="auth-label" for="authPassword">PASSWORD</label>
          <input id="authPassword" class="auth-input" type="password" autocomplete="current-password" required>
          <div id="authConfirmRow" class="hidden">
            <label class="auth-label" for="authConfirm">CONFIRM PASSWORD</label>
            <input id="authConfirm" class="auth-input" type="password" autocomplete="new-password">
          </div>
          <div id="authError" class="auth-error hidden"></div>
          <button id="authSubmit" type="submit" class="auth-btn">SIGN IN</button>
          <button id="authBack" type="button" class="auth-btn auth-btn-ghost">BACK</button>
        </form>
      </div>
    </div>
  </div>

  <div id="loadingScreen" class="loading-screen hidden">
    <div class="loading-studio">LENGTHYEMU8509 STUDIOS</div>
    <div class="loading-text">LOADING<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></div>
  </div>

  <div id="gameApp" class="app hidden">
    <h1 class="title">BLOCKS!</h1>

    <div class="player-row">
      <span id="playerName" class="player-name"></span>
      <button id="signOutBtn" class="signout-btn hidden" type="button">SIGN OUT</button>
    </div>

    <div class="hud-top">
      <div class="panel stat-box">
        <div class="label">SCORE</div>
        <div class="value" id="score">0</div>
      </div>
      <button id="pauseBtn" class="pause-btn" aria-label="Pause">❚❚</button>
      <div class="panel stat-box">
        <div class="label">LEVEL</div>
        <div class="value" id="level">1</div>
      </div>
    </div>

    <div class="main-area">
      <div class="board-wrap">
        <canvas id="game" width="220" height="440"></canvas>
        <div id="overlay" class="overlay hidden">
          <div id="overlayTitle">PAUSED</div>
          <div id="overlaySub"></div>
        </div>
      </div>

      <div class="side-panel">
        <div class="panel">
          <div class="label">NEXT</div>
          <canvas id="next" width="100" height="90"></canvas>
        </div>
        <div class="panel" id="holdPanel">
          <div class="label">HOLD</div>
          <canvas id="hold" width="100" height="90"></canvas>
        </div>
        <div class="panel stats-panel">
          <div class="label">STATS</div>
          <div class="stat-row"><span>LINES</span><span id="lines">0</span></div>
          <div class="stat-row"><span>HIGH SCORE</span><span id="highscore">0</span></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="leftBtn" aria-label="Left">←</button>
      <button id="rightBtn" aria-label="Right">→</button>
      <button id="downBtn" aria-label="Down">↓</button>
      <button id="rotateBtn" aria-label="Rotate">↻</button>
    </div>
  </div>

  <script src="game.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
